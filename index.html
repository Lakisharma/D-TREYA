<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container-fluid m-0 p-0">
        <header id="header">
            <div class="row m-0">
                <div class="col-lg-12 col-md-12 col-sm-12 d-flex justify-content-between align-items-center ">
                    <div><img src="img/logo-design.avif" height="80px" alt=""></div>
                    <div>
                        <nav class="d-flex gap-5 navbar">
                            <a href="#" class="nav-link fs-5">Home</a>
                            <a href="#" class="nav-link fs-5">About</a>
                            <a href="#" class="nav-link fs-5">Srevice</a>
                            <a href="#" class="nav-link fs-5">Blog</a>
                            <a href="#" class="nav-link fs-5">Contact US</a>
                        </nav>
                    </div>
                    <div class="d-flex fs-4 gap-3 p-2 icon">
                        <a href="#" class="nav-link fs-5"><i class="bi bi-person"></i></a>
                        <a href="#" class="nav-link fs-5"><i class="bi bi-cart"></i></a>
                    </div>
                </div>
            </div>
        </header>

        <section id="hero">
            <div class="row m-0 p-0">
                <div class="col-12">
                    <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <img src="img/slider-1.avif" class="d-block w-100" alt="...">
                            </div>
                            <div class="carousel-item">
                                <img src="img/slider-2.avif" class="d-block w-100" alt="...">
                            </div>
                            <div class="carousel-item">
                                <img src="img/slider-3.avif" class="d-block w-100" alt="...">
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
        <section id="Top-Category">
            <div class="row m-0 p-0 g-3">
                <div class="col-12 ">
                    <h1 class="text-center fw-bold"> Top Categories</h1>
                </div>
                <div class="col-lg-2 col-md-4 col-sm-6 col-12 ">
                    <div class="card">
                        <div class="img-Category">
                            <a href="img/Category-wise-data/T-shirt.html"><img src="img/Category/T-shirt/t-shirt2.jpg" class="img-fluid" alt=""></a>
                        </div>
                        <div class="name-Category">
                            <p>T-shirt</p>

                        </div>

                    </div>

                </div>
                <div class="col-lg-2 col-md-4 col-sm-6 col-12 ">
                    <div class="card">
                        <div class="img-Category">
                            <a href="#" class="nav-link"><img src="img/Category/shirts/Shirts-1.jpg" class="img-fluid"
                                    alt=""></a>
                        </div>
                        <div class="name-Category">
                            <p>Shirts</p>

                        </div>

                    </div>

                </div>
                <div class="col-lg-2 col-md-4 col-sm-6 col-12 ">
                    <div class="card">
                        <div class="img-Category">
                            <a href="#" class="nav-link"><img src="img/Category/pant/pant-1.jpg" class="img-fluid" alt=""></a>
                        </div>
                        <div class="name-Category">
                            <p>Cargo Paints</p>

                        </div>

                    </div>

                </div>
                <div class="col-lg-2 col-md-4 col-sm-6 col-12 ">
                    <div class="card">
                        <div class="img-Category">
                            <a href="#" class="nav-link"><img src="img/Category/Formal/formal-1.jpg" class="img-fluid" alt=""></a>
                        </div>
                        <div class="name-Category">
                            <p>Formal</p>

                        </div>

                    </div>

                </div>
                
                <div class="col-lg-2 col-md-4 col-sm-6 col-12 ">
                    <div class="card">
                        <div class="img-Category">
                            <a href="#" class="nav-link"><img src="img/Category/pant/pant-4.jpg" class="img-fluid"
                                    alt=""></a>
                        </div>
                        <div class="name-Category">
                            <p>Paint</p>

                        </div>

                    </div>

                </div>
                <div class="col-lg-2 col-md-4 col-sm-6 col-12 ">
                    <div class="card">
                        <div class="img-Category">
                            <a href="#" class="nav-link"><img src="img/Category/watch/watch-1.jpg" class="img-fluid" alt=""></a>
                        </div>
                        <div class="name-Category">
                            <p>Watches</p>

                        </div>

                    </div>

                </div>
                <div class="col-lg-2 col-md-4 col-sm-6 col-12 mt-2">
                    <div class="card">
                        <div class="img-Category">
                            <a href="#" class="nav-link"><img src="img/Category/Shoes/shoes-1.webp" class="img-fluid" alt=""></a>
                        </div>
                        <div class="name-Category">
                            <p>Shoes</p>

                        </div>

                    </div>

                </div>
            </div>
           

        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"

</html>
